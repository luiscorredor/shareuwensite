<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta | shareU</title><link rel="stylesheet" href="style.css"><style>.cuenta{max-width:560px;margin:55px auto;padding:28px;background:var(--pizarra-suave);border:1px solid #ffffff22;border-radius:12px}.cuenta form{display:grid;gap:12px}.cuenta input,.cuenta select,.cuenta textarea{width:100%;padding:12px;border-radius:5px;border:1px solid #ffffff35;background:#193126;color:var(--tiza);font:inherit}.cuenta button,.accion{padding:12px 16px;background:var(--acento);color:var(--pizarra);border:0;border-radius:5px;font-weight:700;cursor:pointer}.cuenta p{color:var(--tiza-tenue)}.cuenta a{color:var(--acento)}.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}.estado{min-height:1.5em;color:var(--acento)}@media(max-width:500px){.fila{grid-template-columns:1fr}}</style></head>
<body><header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">shareU</a><a href="index.html" style="margin-left:auto;color:var(--tiza)">Volver a buscar</a></header>
<main class="cuenta"><h1>Tu cuenta de shareU</h1><p>Regístrate para compartir apuntes y documentos de tu universidad.</p>
<form id="registro"><h2>Crear cuenta</h2><input name="name" placeholder="Nombre completo" required maxlength="100"><input name="email" type="email" placeholder="Correo electrónico" required><input name="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6"><div class="fila"><input name="university" placeholder="Universidad" required maxlength="120"><input name="career" placeholder="Carrera" required maxlength="120"></div><button>Registrarme</button></form>
<hr style="margin:25px 0;border-color:#ffffff22"><form id="ingreso"><h2>Iniciar sesión</h2><input name="email" type="email" placeholder="Correo electrónico" required><input name="password" type="password" placeholder="Contraseña" required><button>Entrar</button></form><p class="estado" id="estado" role="status" aria-live="polite"></p><p>Al registrarte, tus documentos nuevos quedan pendientes de aprobación antes de ser visibles para otros usuarios.</p></main>
<script type="module">
import {isFirebaseConfigured} from './firebase-service.js';
import {registerUser,loginUser} from './firebase-service.js';
const estado=document.querySelector('#estado');
if(!isFirebaseConfigured){estado.textContent='Falta configurar firebase-config.js con los datos de tu proyecto Firebase.';}
document.querySelector('#registro').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;const d=Object.fromEntries(new FormData(f));try{await registerUser(d);location.href='panel.html';}catch(err){estado.textContent=mensaje(err);}});
document.querySelector('#ingreso').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await loginUser(d.email,d.password);location.href='panel.html';}catch(err){estado.textContent=mensaje(err);}});
function mensaje(e){
 const code=e?.code||'sin-codigo';
 const mensajes={
  'auth/email-already-in-use':'Ese correo ya tiene una cuenta en Authentication. No vuelvas a registrarte; intenta iniciar sesión.',
  'auth/invalid-credential':'Correo o contraseña incorrectos.',
  'auth/weak-password':'Usa una contraseña de al menos 6 caracteres.',
  'auth/invalid-email':'El correo no es válido.',
  'auth/operation-not-allowed':'Activa Email/Password en Firebase Authentication.',
  'permission-denied':'Firebase rechazó la escritura en Firestore. Revisa y publica las reglas de firestore.rules.',
  'unavailable':'Firebase no está disponible ahora. Comprueba tu conexión e inténtalo otra vez.',
  'failed-precondition':'Firestore necesita configuración adicional; revisa el mensaje de error en la consola.'
 };
 return (mensajes[code]||'No se pudo completar la operación.')+' Código: '+code+(e?.message?' — '+e.message:'');
}
</script></body></html>
