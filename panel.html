<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | shareU</title><link rel="stylesheet" href="style.css"><style>.contenedor{max-width:1100px;margin:auto;padding:32px 24px}.tarjeta{background:var(--pizarra-suave);padding:22px;border:1px solid #ffffff20;border-radius:10px;margin:18px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:11px;border:1px solid #ffffff35;border-radius:5px;background:#193126;color:var(--tiza);font:inherit}.form-grid textarea,.form-grid button{grid-column:1/-1}.form-grid textarea{min-height:80px}.form-grid button{padding:12px;background:var(--acento);border:0;border-radius:5px;font-weight:700;cursor:pointer}.documento{padding:16px 0;border-bottom:1px solid #ffffff25;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.documento a{color:var(--acento)}.documento button{margin:4px;padding:8px 12px;cursor:pointer}.estado{color:var(--acento);min-height:1.4em}.etiqueta{font-size:.8rem;padding:4px 8px;border:1px solid #ffffff40;border-radius:4px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.form-grid textarea,.form-grid button{grid-column:auto}}</style></head>
<body><header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none">shareU · Panel</a><span id="identidad"></span><button id="salir" class="modo-btn">Cerrar sesión</button></header>
<main class="contenedor"><h1>Panel de usuario</h1><p>Sube materiales académicos que tengas permiso de compartir. Los archivos nuevos requieren aprobación.</p>
<section class="tarjeta"><h2>Compartir un documento</h2><form id="subida" class="form-grid"><input name="title" placeholder="Título" maxlength="150" required><input name="subject" placeholder="Materia" maxlength="120" required><input name="university" placeholder="Universidad" maxlength="120" required><input name="career" placeholder="Carrera" maxlength="120" required><select name="type" required><option value="">Tipo de documento</option><option>Apuntes</option><option>Taller</option><option>Parcial</option><option>Ejercicios</option><option>Guía</option><option>Presentación</option><option>Otro</option></select><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.pptx,.xlsx,.txt" required><textarea name="description" placeholder="Descripción opcional" maxlength="1000"></textarea><button id="subirBtn">Subir para revisión</button></form><p class="estado" id="estadoSubida" role="status" aria-live="polite"></p></section>
<section class="tarjeta"><h2>Mis documentos</h2><div id="misDocs">Cargando…</div></section><section class="tarjeta" id="admin" hidden><h2>Administración · pendientes</h2><p>El rol admin debe asignarse manualmente desde la consola de Firebase.</p><div id="pendientes"></div></section></main>
<script type="module">
import {auth,isFirebaseConfigured,onAuthStateChanged,signOut,getUserProfile,uploadDocument,listOwnDocuments,listPendingDocuments,moderateDocument} from './firebase-service.js';
const $=s=>document.querySelector(s);let currentUser=null,profile=null;
$('#salir').addEventListener('click',async()=>{await signOut(auth);location.href='cuenta.html';});
onAuthStateChanged(auth,async user=>{if(!isFirebaseConfigured){$('#identidad').textContent='Firebase sin configurar';$('#misDocs').textContent='Completa firebase-config.js para activar el panel.';return;}if(!user){location.href='cuenta.html';return;}currentUser=user;try{profile=await getUserProfile(user.uid);$('#identidad').textContent=user.displayName||user.email;$('#admin').hidden=profile?.role!=='admin';await refresh();}catch(e){console.error(e);$('#misDocs').textContent='No se pudo leer el perfil. Revisa las reglas de Firestore.';}});
$('#subida').addEventListener('submit',async e=>{e.preventDefault();if(!currentUser)return;const f=e.currentTarget,d=Object.fromEntries(new FormData(f)),file=d.file;delete d.file;if(!file||file.size>20*1024*1024){$('#estadoSubida').textContent='Selecciona un archivo de máximo 20 MB.';return;}$('#subirBtn').disabled=true;$('#estadoSubida').textContent='Subiendo…';try{await uploadDocument({...d,file,user:currentUser});f.reset();$('#estadoSubida').textContent='Subido. Quedó pendiente de aprobación.';await refresh();}catch(err){console.error(err);$('#estadoSubida').textContent='Falló la subida. Revisa configuración y reglas de Firebase.';}finally{$('#subirBtn').disabled=false;}});
async function refresh(){const mine=await listOwnDocuments(currentUser.uid);$('#misDocs').innerHTML=mine.length?mine.map(card).join(''):'Aún no has subido documentos.';if(profile?.role==='admin'){const pending=await listPendingDocuments();$('#pendientes').innerHTML=pending.length?pending.map(d=>card(d,true)).join(''):'No hay documentos pendientes.';}}
function card(d,admin=false){return '<div class="documento"><div><strong>'+esc(d.title)+'</strong><p>'+esc(d.subject)+' · '+esc(d.type)+' · <span class="etiqueta">'+esc(d.status)+'</span></p><small>'+esc(d.fileName)+'</small></div><div>'+(d.downloadURL?'<a href="'+safeUrl(d.downloadURL)+'" target="_blank" rel="noopener noreferrer">Abrir archivo</a>':'')+(admin?'<button data-id="'+esc(d.id)+'" data-status="approved">Aprobar</button><button data-id="'+esc(d.id)+'" data-status="rejected">Rechazar</button>':'')+'</div></div>';}
$('#pendientes').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;try{await moderateDocument(b.dataset.id,b.dataset.status);await refresh();}catch(err){console.error(err);alert('No se pudo moderar. Confirma el rol admin y las reglas de Firestore.');b.disabled=false;}});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:'#';}catch{return '#';}}
</script></body></html>
